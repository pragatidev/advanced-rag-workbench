# Optional. Only for the pgvector lecture cells.
# docker compose up -d
# Then run labs/lab_s3_naive/part_3/compare_stores.py
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_DB: acme_rag
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d acme_rag"]
      interval: 5s
      timeout: 5s
      retries: 10
